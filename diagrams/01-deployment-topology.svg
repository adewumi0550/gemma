<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Deployment topology: local laptop and Google Cloud Run</title>
<desc>A local laptop running Ollama with Gemma 4 connects by a single environment variable to Google Cloud Run, which contains gemma-agent on CPU and gemma-model on an L4 GPU.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  .th { font: 600 15px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ts { font: 400 12.5px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
</defs>

<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>

<rect x="40" y="110" width="210" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="145" y="132" text-anchor="middle" dominant-baseline="central" fill="#444441">Your laptop</text>
<text class="ts" x="145" y="152" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Ollama + Gemma 4</text>

<text class="ts" x="303" y="126" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">same code</text>
<line x1="255" y1="142" x2="352" y2="142" class="arr" marker-end="url(#arrow)"/>

<rect x="360" y="40" width="280" height="220" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="500" y="68" text-anchor="middle" dominant-baseline="central" fill="#444441">Google Cloud Run</text>

<rect x="385" y="95" width="230" height="60" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="500" y="117" text-anchor="middle" dominant-baseline="central" fill="#3C3489">gemma-agent</text>
<text class="ts" x="500" y="137" text-anchor="middle" dominant-baseline="central" fill="#534AB7">FastAPI · CPU</text>

<line x1="500" y1="157" x2="500" y2="174" class="arr" marker-end="url(#arrow)"/>

<rect x="385" y="180" width="230" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="500" y="202" text-anchor="middle" dominant-baseline="central" fill="#085041">gemma-model</text>
<text class="ts" x="500" y="222" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Ollama · L4 GPU</text>
</svg>
