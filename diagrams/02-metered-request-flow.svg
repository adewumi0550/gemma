<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Metered request flow through the Gemma agent</title>
<desc>A user sends a request with a bearer API key to gemma-agent, which verifies the key, runs the agent loop against gemma-model on GPU, and writes token usage to Firestore or Cloud SQL. The tokenic MCP server reads and writes that same store through nine tools.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  .th { font: 600 15px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .ts { font: 400 12.5px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
</style>
</defs>

<rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>

<rect x="245" y="40" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="#444441">User</text>
<text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Bearer tk_live_…</text>

<line x1="340" y1="96" x2="340" y2="128" class="arr" marker-end="url(#arrow2)"/>

<rect x="200" y="130" width="280" height="76" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="340" y="157" text-anchor="middle" dominant-baseline="central" fill="#3C3489">gemma-agent</text>
<text class="ts" x="340" y="180" text-anchor="middle" dominant-baseline="central" fill="#534AB7">verify key · run loop · meter</text>

<text class="ts" x="212" y="226" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">inference</text>
<path d="M 270 206 L 270 244 L 160 244 L 160 258" class="arr" marker-end="url(#arrow2)"/>

<text class="ts" x="470" y="226" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">usage</text>
<path d="M 410 206 L 410 244 L 520 244 L 520 258" class="arr" marker-end="url(#arrow2)"/>

<rect x="40" y="260" width="240" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="160" y="282" text-anchor="middle" dominant-baseline="central" fill="#085041">gemma-model</text>
<text class="ts" x="160" y="302" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Gemma 4 · L4 GPU</text>

<rect x="400" y="260" width="240" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="520" y="282" text-anchor="middle" dominant-baseline="central" fill="#712B13">Firestore / Cloud SQL</text>
<text class="ts" x="520" y="302" text-anchor="middle" dominant-baseline="central" fill="#993C1D">tokens per key</text>

<line x1="520" y1="368" x2="520" y2="324" class="arr" marker-end="url(#arrow2)"/>

<rect x="400" y="370" width="240" height="60" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="520" y="392" text-anchor="middle" dominant-baseline="central" fill="#712B13">tokenic_mcp</text>
<text class="ts" x="520" y="412" text-anchor="middle" dominant-baseline="central" fill="#993C1D">9 MCP tools</text>
</svg>
